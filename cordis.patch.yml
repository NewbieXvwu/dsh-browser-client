# dsh-browser-host bundle patch: the host-side bridge for the DSH Browser
# Client extension. Insert this bundle into a profile layer stack so the
# extension can drive this harness from a floating panel in any page.
#
# The floating window is the real DSH WebUI served by this plugin at
# /browser-ui/: the official index is read through webServer.readResource with
# the owner peer (no cookie), decorated with a transport shim, and embeds
# without any full-page navigation. /browser-ui-mux proxies the official
# /api/remote.mux stream for that page.
#
# The /api trust fence of the official browser client requires a same-origin
# caller (Origin must equal the Host header); a browser-extension page
# (chrome-extension://…) can never satisfy it. The plugin therefore also opens
# a token-authenticated surface for the extension: /ext-api/* (HTTP RPC proxy
# over the official client-connection transport, with the owner browser Peer),
# /ext-events.mux (WebSocket pump of Cordis session events) and
# /ext-api-control (bidirectional page_* tool channel). The token is minted at
# boot and printed in the log (plus written to $DSH_HOME/browser-client-token).
- insert:
    - id: dsh-browser-host
      name: 'dsh-browser-host'
      config:
        # Prefix for the extension-facing surface. Keep the default unless the
        # official /api prefix is customized by a deployment.
        extPrefix: /ext-api
        # WS event-stream path (extension-facing).
        extEventsPath: /ext-events.mux
        # If false, tokens are minted fresh at boot (no persistence).
        persistToken: true
        # Extra CORS/WS origins allowed (exact origin strings). The plugin
        # already allows chrome-extension://, moz-extension:// and
        # safari-extension:// origins; list additional ones here for dev pages
        # (e.g. http://127.0.0.1:8899).
        extraOrigins: []
